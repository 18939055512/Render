<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>果果图片转wordpdf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>果果图片转wordpdf</h1>
    <p class="subtitle">上传图片 · 调整顺序 · 一键生成</p>
  </header>

  <main class="container">
    <!-- 上传区 -->
    <label class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="upload-icon">+</div>
      <div class="upload-text">点击选择图片（可多选）</div>
      <div class="upload-hint">支持 JPG / PNG / WebP / GIF / BMP</div>
    </label>

    <!-- 图片列表 -->
    <div class="gallery-wrap">
      <div class="gallery-header">
        <span>图片列表</span>
        <span class="count" id="count">0 张</span>
      </div>
      <div id="gallery" class="gallery"></div>
      <div class="empty-tip" id="emptyTip">尚未上传图片，点击上方区域选择</div>
    </div>

    <!-- 提示信息 -->
    <div class="hint-bar">
      <span class="hint-dot"></span>
      长按图片卡片可拖拽调整顺序，顺序即为 Word 中图片的顺序
    </div>
  </main>

  <!-- 底部操作栏 -->
  <footer class="bottombar">
    <div class="btn-row">
      <button id="generateBtn" class="btn-generate" disabled>
        生成 Word
      </button>
      <button id="generatePdfBtn" class="btn-generate btn-pdf" disabled>
        生成 PDF
      </button>
    </div>
  </footer>

  <!-- 生成结果弹层 -->
  <div class="modal" id="resultModal">
    <div class="modal-content">
      <div class="modal-icon">✓</div>
      <h2 id="modalTitle">文档已生成</h2>
      <p class="modal-desc" id="modalDesc">文档已准备好，点击下方按钮下载</p>
      <a id="downloadLink" class="btn-download" download>下载文档</a>
      <button class="btn-close" id="closeModal">关闭</button>
    </div>
  </div>

  <!-- 加载遮罩 -->
  <div class="loading-mask" id="loadingMask">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">正在生成 Word 文档…</p>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
